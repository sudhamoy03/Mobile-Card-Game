name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Restore Stable Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding stable debug keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding stable debug keystore from secret DEBUG_KEYSTORE_BASE64..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            echo "Warning: debug.keystore.base64 not found."
          fi
          if [ -f "debug.keystore" ]; then
            echo "Stable debug keystore restored successfully."
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
          fi

      - name: Restore google-services.json if provided in Secrets
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from secret."
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            echo "Restored app/google-services.json from secret."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --no-daemon
          else
            gradle testDebugUnitTest --no-daemon
          fi

      - name: Assemble Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
